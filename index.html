    .hint { font-size: 10px; color: #4a5a80; margin-top: 8px; line-height: 1.5; border-top: 1px solid rgba(60,80,120,0.2); padding-top: 8px; }
    .hint kbd { background: rgba(40,60,90,0.6); padding: 1px 4px; border-radius: 3px; font-size: 10px; color: #a0b0d8; }

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════
//  FRACTAL GPU EXPLORER — Dynamic Shader Generation
//  GPU-accelerated fractal rendering via WebGL fragment shaders.
//  Each pixel is computed independently on the GPU in parallel.
//  When you switch fractals, a focused shader is compiled on-the-fly
//  containing only that formula — no 100-branch if/else tree.
// ═══════════════════════════════════════════════════════════════════

const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
if (!gl) { document.body.innerHTML = '<div style="color:#f80;padding:20px;font-family:monospace">WebGL not available.</div>'; throw new Error('No WebGL'); }

const VERT_SRC = `
attribute vec2 a_position;
void main() { gl_Position = vec4(a_position, 0.0, 1.0); }
`;

// ─── Shader builder: assembles a focused fragment shader for one fractal ───
const FRAG_HEADER = `precision highp float;
uniform vec2 u_resolution; uniform vec2 u_center; uniform float u_zoom;
uniform float u_maxIter; uniform vec2 u_juliaC; uniform float u_power;
uniform float u_phoenixP; uniform int u_palette; uniform float u_colorSpeed;
uniform float u_colorOffset; uniform int u_smooth;
vec2 cmul(vec2 a,vec2 b){return vec2(a.x*b.x-a.y*b.y,a.x*b.y+a.y*b.x);}
vec2 cpow(vec2 z,float n){float r=length(z);if(r<1e-15)return vec2(0.0);float t=atan(z.y,z.x);float rn=pow(r,n);return vec2(rn*cos(n*t),rn*sin(n*t));}
vec2 cdiv(vec2 a,vec2 b){float d=dot(b,b);if(d<1e-15)return vec2(0.0);return vec2((a.x*b.x+a.y*b.y)/d,(a.y*b.x-a.x*b.y)/d);}
float _sinh(float x){return (exp(x)-exp(-x))*0.5;}
float _cosh(float x){return (exp(x)+exp(-x))*0.5;}
vec2 csin(vec2 z){return vec2(sin(z.x)*_cosh(z.y),cos(z.x)*_sinh(z.y));}
vec2 ccos(vec2 z){return vec2(cos(z.x)*_cosh(z.y),-sin(z.x)*_sinh(z.y));}
vec2 cexp(vec2 z){float e=exp(z.x);return vec2(e*cos(z.y),e*sin(z.y));}
vec2 ctan(vec2 z){vec2 s=csin(z),co=ccos(z);float d=dot(co,co);if(d<1e-15)return vec2(1e6,0.0);return vec2((s.x*co.x+s.y*co.y)/d,(s.y*co.x-s.x*co.y)/d);}
vec3 palCosmic(float t){return 0.5+0.5*cos(6.28318*(vec3(0.0,0.33,0.67)+t));}
vec3 palFire(float t){return vec3(pow(t,0.5),pow(t,1.5),pow(t,4.0));}
vec3 palOcean(float t){return vec3(0.5*sin(6.28318*t)*t,0.3+0.7*t,0.4+0.6*pow(1.0-t,0.3));}
vec3 palElectric(float t){return 0.5+0.5*cos(6.28318*(vec3(0.15,0.55,0.85)+t));}
vec3 palForest(float t){return vec3(pow(t,2.0)*0.8,0.3+0.7*sqrt(t),0.2*(1.0-t));}
vec3 palGrayscale(float t){return vec3(t);}
vec3 getColor(float t){if(u_palette==0)return palCosmic(t);if(u_palette==1)return palFire(t);if(u_palette==2)return palOcean(t);if(u_palette==3)return palElectric(t);if(u_palette==4)return palForest(t);return palGrayscale(t);}
`;

const FRAG_FOOTER = `
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*u_resolution)/u_resolution.y;
  vec2 c,z; vec2 z_prev=vec2(0.0);
  bool julia={{JULIA}};
  if(julia){z=uv*(3.0/u_zoom)+u_center;c=u_juliaC;}
  else{c=uv*(3.0/u_zoom)+u_center;z=vec2(0.0);}
  float iter=0.0,maxI=u_maxIter;bool escaped=false;
  for(int i=0;i<2000;i++){
    if(float(i)>=maxI) break;
    {{FORMULA}}
    float r2=dot(z,z);
    if(r2>256.0){
      if(u_smooth==1){float log_zn=log(r2)*0.5;float nu=log(log_zn/log(2.0))/log(2.0);iter=float(i)+1.0-nu;}
      else iter=float(i);
      escaped=true;break;
    }
  }
  if(!escaped) gl_FragColor=vec4(0.0,0.0,0.0,1.0);
  else{float t=fract(iter/maxI*u_colorSpeed+u_colorOffset);gl_FragColor=vec4(getColor(t),1.0);}
}
`;

// Formula table: [julia_check_glsl, iteration_code_glsl]
// julia_check_glsl: bool GLSL expression (true = use Julia mode)
// Types 1=Julia and 30=MandelbarJulia are Julia-family
const FORMULAS = {
  0:  ['false', 'z = cmul(z,z) + c;'],
  1:  ['true',  'z = cmul(z,z) + c;'],
  2:  ['false', 'z = vec2(abs(z.x),abs(z.y)); z = cmul(z,z)+c;'],
  3:  ['false', 'z = vec2(z.x*z.x-z.y*z.y, -2.0*z.x*z.y) + c;'],
  4:  ['false', 'z = cpow(z, u_power) + c;'],
  5:  ['false', 'vec2 zn=cmul(z,z)+c+u_phoenixP*z_prev; z_prev=z; z=zn;'],
  6:  ['false', 'z = vec2(abs(z.x),z.y); z = cmul(z,z)+c;'],
  7:  ['false', 'z = vec2(z.x,abs(z.y)); z = cmul(z,z)+c;'],
  8:  ['false', 'z = cmul(z,z) + cmul(c,c);'],
  9:  ['false', 'z = csin(z) + c;'],
  10: ['false', 'z = ccos(z) + c;'],
  11: ['false', 'z = cexp(z) + c;'],
  12: ['false', 'vec2 z2=cmul(z,z); z=vec2(abs(z2.x),abs(z2.y))+c;'],
  13: ['false', 'vec2 zz=cmul(z,z); vec2 d=z; if(dot(d,d)<1e-20) d=vec2(1e-10,0.0); z=zz+cdiv(c,d);'],
  14: ['false', 'z = ctan(z) + c;'],
  15: ['false', 'vec2 z3=cmul(cmul(z,z),z); vec2 n=z3-vec2(1.0,0.0); vec2 d=3.0*cmul(z,z); if(dot(d,d)<1e-20) d=vec2(1e-10,0.0); z=z-cdiv(n,d);'],
  16: ['false', 'vec2 z3=cmul(cmul(z,z),z); vec2 n=z3-vec2(1.0,0.0); vec2 d=3.0*cmul(z,z); if(dot(d,d)<1e-20) d=vec2(1e-10,0.0); z=z-2.5*cdiv(n,d)+c;'],
  17: ['false', 'z = cmul(z,z)+c+vec2(abs(c.x),abs(c.y));'],
  18: ['false', 'vec2 zn=cmul(z,z)+c+z_prev; z_prev=z; z=zn;'],
  19: ['false', 'z = cmul(c, cmul(z, vec2(1.0,0.0)-z));'],
  20: ['false', 'vec2 z2=cmul(z,z); z=abs(z2)+c;'],
  21: ['false', 'z = vec2(z.x,abs(z.y)); z = cmul(z,z)+c;'],
  22: ['false', 'vec2 z2=cmul(z,z); z=csin(z2)+c;'],
  23: ['false', 'z = cmul(cmul(z,z),z)+c;'],
  24: ['false', 'vec2 zz=cmul(z,z); vec2 d=z; if(dot(d,d)<1e-20) d=vec2(1e-10,0.0); z=zz+cdiv(c,cmul(d,d));'],
  25: ['false', 'vec2 zn=cmul(z,z)+c; c=0.5*c+z; z=zn;'],
  26: ['false', 'vec2 ci=c; if(dot(ci,ci)<1e-20) ci=vec2(1e-10,0.0); z=cmul(z,z)+cdiv(vec2(1.0,0.0),ci);'],
  27: ['false', 'z = cmul(cmul(z,z),c);'],
  28: ['false', 'vec2 z2=cmul(z,z); z=cmul(z2,z2)+c;'],
  29: ['false', 'vec2 z2=cmul(z,z); vec2 z4=cmul(z2,z2); z=cmul(z4,z)+c;'],
  30: ['true',  'z = vec2(z.x*z.x-z.y*z.y, -2.0*z.x*z.y) + c;'],
  31: ['false', 'vec2 c3=cmul(cmul(c,c),c); z=cmul(z,z)+c3;'],
  32: ['false', 'z = cmul(z,z)+vec2(c.x,0.0);'],
  33: ['false', 'vec2 d=cmul(z,z)+c; if(dot(d,d)<1e-20) d=vec2(1e-10,0.0); z=cdiv(vec2(1.0,0.0),d);'],
  34: ['false', 'vec2 zcs=vec2(z.x*z.x-z.y*z.y,-2.0*z.x*z.y); z=zcs+c+vec2(length(z),0.0);'],
  35: ['false', 'z = cmul(z,z)+c+cmul(c,vec2(abs(c.x),abs(c.y)));'],
  36: ['false', 'z = cmul(z,z)-c;'],
  37: ['false', 'z = cmul(cmul(z,z),z)-c;'],
  38: ['false', 'float r=length(z); float th=atan(z.y,z.x); if(r<1e-15) r=1e-15; z=vec2(log(r),th)+c;'],
  39: ['false', 'vec2 z2=cmul(z,z); vec2 omz=vec2(1.0,0.0)-z2; float r=length(omz); float th=atan(omz.y,omz.x); if(r<1e-15) r=1e-15; vec2 st=vec2(sqrt(r)*cos(th*0.5),sqrt(r)*sin(th*0.5)); vec2 iz=vec2(-z.y,z.x); vec2 li=iz+st; float r2=length(li); float t2=atan(li.y,li.x); if(r2<1e-15) r2=1e-15; z=vec2(t2,-log(r2))+c;'],
  40: ['false', 'vec2 zc=vec2(z.x,-z.y); z=cmul(cmul(zc,zc),zc)+c;'],
  41: ['false', 'vec2 n=z+c; vec2 d=z-c; if(dot(d,d)<1e-20) d=vec2(1e-10,0.0); vec2 r=cdiv(n,d); z=cmul(r,r);'],
  42: ['false', 'vec2 opz=vec2(1.0,0.0)+2.0*z; vec2 ct=ccos(3.14159265*z); z=(vec2(1.0,0.0)+4.0*z-cmul(opz,ct))*0.5+c;'],
  43: ['false', 'float r=length(z); float th=atan(z.y,z.x); if(r<1e-15) r=1e-15; z=vec2(sqrt(r)*cos(th*0.5),sqrt(r)*sin(th*0.5))+c;'],
  44: ['false', 'z = cmul(z,c)+cmul(z,z);'],
  45: ['false', 'float ex=exp(z.x),em=exp(-z.x); z=vec2((ex-em)*0.5*cos(z.y),(ex+em)*0.5*sin(z.y))+c;'],
  46: ['false', 'float e2x=exp(2.0*z.x); float ch=(e2x+1.0)/(2.0*exp(z.x)); float sh=(e2x-1.0)/(2.0*exp(z.x)); float den=ch*ch*cos(z.y)*cos(z.y)+sh*sh*sin(z.y)*sin(z.y); if(den<1e-15) den=1e-15; z=vec2(sh*ch*cos(z.y)*cos(z.y)+sh*ch*sin(z.y)*sin(z.y),ch*sh*sin(z.y)*cos(z.y)-sh*ch*sin(z.y)*cos(z.y))/den+c;'],

let currentProgram = null;
let U = {};

function buildShader(type) {
  const [julia, formula] = FORMULAS[type] || FORMULAS[0];
  const frag = FRAG_HEADER + FRAG_FOOTER.replace('{{JULIA}}', julia).replace('{{FORMULA}}', formula);
  const vert = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vert, VERT_SRC); gl.compileShader(vert);
  const f = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(f, frag); gl.compileShader(f);
  if (!gl.getShaderParameter(f, gl.COMPILE_STATUS)) {
    console.error('Shader compile error:', gl.getShaderInfoLog(f));
    throw new Error('Shader compile failed for type ' + type);
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, vert); gl.attachShader(prog, f); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('Link error');

  // Cache uniform locations
  U = {
    resolution:  gl.getUniformLocation(prog, 'u_resolution'),
    center:      gl.getUniformLocation(prog, 'u_center'),
    zoom:        gl.getUniformLocation(prog, 'u_zoom'),
    maxIter:     gl.getUniformLocation(prog, 'u_maxIter'),
    juliaC:      gl.getUniformLocation(prog, 'u_juliaC'),
    power:       gl.getUniformLocation(prog, 'u_power'),
    phoenixP:    gl.getUniformLocation(prog, 'u_phoenixP'),
    palette:     gl.getUniformLocation(prog, 'u_palette'),
    colorSpeed:  gl.getUniformLocation(prog, 'u_colorSpeed'),
    colorOffset: gl.getUniformLocation(prog, 'u_colorOffset'),
    smooth:      gl.getUniformLocation(prog, 'u_smooth'),
  };
  return prog;
}

// Full-screen quad
const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const buffer = gl.createBuffer();

// ─── View & State ───
const view = { centerX: -0.5, centerY: 0.0, zoom: 1.0 };
const state = { fractalType: 0, maxIter: 256, palette: 0, colorSpeed: 1.0, colorOffset: 0.0, smooth: true, juliaX: -0.7269, juliaY: 0.1889, power: 3.0, phoenixP: 0.5 };

// ─── Adaptive iterations: more zoom = more detail ───
function getAdaptiveIterations() {
  const z = view.zoom;
  if (z < 1) return 128;
  if (z < 10) return 256;
  if (z < 100) return 512;
  if (z < 1000) return 1024;
  if (z < 10000) return 1536;
  return 2000;
}

function updateIterDisplay() {
  const el = document.getElementById('iterations');
  const val = document.getElementById('iterVal');
  if (el && val) {
    el.value = state.maxIter;
    val.textContent = state.maxIter;
  }
}

// ─── Resize ───
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width  = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

// ─── Render ───
function render() {
  // Auto-scale iterations based on zoom depth
  state.maxIter = getAdaptiveIterations();
  updateIterDisplay();
  gl.useProgram(currentProgram);
  gl.uniform2f(U.resolution, canvas.width, canvas.height);
  gl.uniform2f(U.center, view.centerX, view.centerY);
  gl.uniform1f(U.zoom, view.zoom);
  gl.uniform1f(U.maxIter, state.maxIter);
  gl.uniform2f(U.juliaC, state.juliaX, state.juliaY);
  gl.uniform1f(U.power, state.power);
  gl.uniform1f(U.phoenixP, state.phoenixP);
  gl.uniform1i(U.palette, state.palette);
  gl.uniform1f(U.colorSpeed, state.colorSpeed);
  gl.uniform1f(U.colorOffset, state.colorOffset);
  gl.uniform1i(U.smooth, state.smooth ? 1 : 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(currentProgram, 'a_position');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  updateCoordDisplay();
}

function updateCoordDisplay() {
  const pixSize = 3.0 / view.zoom / canvas.height * (window.devicePixelRatio || 1);
  const zoomStr = view.zoom < 1000 ? view.zoom.toFixed(1) + '×' : view.zoom.toExponential(2) + '×';
  document.getElementById('coords').innerHTML = `center: (${view.centerX.toFixed(6)}, ${view.centerY.toFixed(6)})<br>zoom: ${zoomStr}<br>pixel: ${pixSize.toExponential(3)}`;
}

// ─── Switch fractal ───
function setFractalType(type) {
  state.fractalType = type;
  document.getElementById('fractalType').value = type;
  document.getElementById('juliaParams').style.display = (type === 1 || type === 30) ? 'block' : 'none';
  document.getElementById('multibrotParams').style.display = type === 4 ? 'block' : 'none';
  document.getElementById('phoenixParams').style.display = type === 5 ? 'block' : 'none';
  // Rebuild shader
  currentProgram = buildShader(type);
  // Default centers
  if (type === 2 || type === 12 || type === 20) { view.centerX = -0.5; view.centerY = -0.5; view.zoom = 0.7; }
  else if (type === 1) { view.centerX = 0; view.centerY = 0; view.zoom = 1.0; }
  else if (type === 4 || type === 23 || type === 28 || type === 29) { view.centerX = 0; view.centerY = 0; view.zoom = 0.7; }
  else if (type === 5) { view.centerX = 0; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 8 || type === 26 || type === 31 || type === 32 || type === 34 || type === 35 || type === 41 || type === 43) { view.centerX = -0.5; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 9 || type === 10 || type === 11 || type === 14 || type === 38 || type === 42) { view.centerX = 0; view.centerY = 0; view.zoom = 0.5; }
  else if (type === 13 || type === 24 || type === 33) { view.centerX = 0; view.centerY = 0; view.zoom = 0.5; }
  else if (type === 15 || type === 16 || type === 25) { view.centerX = 0; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 17 || type === 21 || type === 36) { view.centerX = -0.5; view.centerY = 0; view.zoom = 1.0; }
  else if (type === 18) { view.centerX = -0.5; view.centerY = -0.5; view.zoom = 0.7; }
  else if (type === 19 || type === 44) { view.centerX = -0.5; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 22 || type === 27) { view.centerX = -0.5; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 30 || type === 40) { view.centerX = 0; view.centerY = 0; view.zoom = 1.0; }
  else if (type === 37) { view.centerX = 0; view.centerY = 0; view.zoom = 0.7; }
  else if (type === 39) { view.centerX = 0; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 45 || type === 46) { view.centerX = 0; view.centerY = 0; view.zoom = 0.5; }
  else if (type === 47 || type === 48) { view.centerX = 0; view.centerY = 0; view.zoom = 0.7; }
  else if (type === 49 || type === 50 || type === 51 || type === 52) { view.centerX = -0.5; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 53) { view.centerX = -0.5; view.centerY = 0; view.zoom = 0.5; }
  else if (type === 54) { view.centerX = -0.5; view.centerY = -0.5; view.zoom = 0.7; }
  else if (type === 55 || type === 56 || type === 60 || type === 62) { view.centerX = -0.5; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 57 || type === 58 || type === 59) { view.centerX = 0; view.centerY = 0; view.zoom = 0.5; }
  else if (type === 61) { view.centerX = 0; view.centerY = 0; view.zoom = 0.7; }
  else if (type === 63) { view.centerX = 0; view.centerY = 0; view.zoom = 0.7; }
  else if (type === 64) { view.centerX = -0.5; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 65 || type === 66 || type === 70 || type === 71 || type === 72 || type === 77 || type === 78 || type === 80 || type === 82 || type === 83 || type === 85 || type === 86 || type === 88 || type === 89 || type === 90 || type === 92 || type === 94 || type === 95 || type === 96 || type === 97 || type === 98 || type === 99) { view.centerX = -0.5; view.centerY = 0; view.zoom = 0.8; }
  else if (type === 67 || type === 68 || type === 69 || type === 73 || type === 74 || type === 75 || type === 76 || type === 79 || type === 81 || type === 84 || type === 87 || type === 91 || type === 93) { view.centerX = 0; view.centerY = 0; view.zoom = 0.7; }
  else { view.centerX = -0.5; view.centerY = 0; view.zoom = 1.0; }
  render();
}

// ─── Mouse + Touch + Keyboard ───
let isDragging = false, lastMouse = { x: 0, y: 0 }, touchState = null;
canvas.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mouseup', () => isDragging = false);
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dpr = window.devicePixelRatio || 1;
  const dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
  const scale = 3.0 / view.zoom / canvas.height * dpr;
  view.centerX -= dx * scale * 2; view.centerY += dy * scale * 2;
  lastMouse = { x: e.clientX, y: e.clientY }; render();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const mx = (e.clientX * dpr - 0.5 * canvas.width) / canvas.height;
  const my = -(e.clientY * dpr - 0.5 * canvas.height) / canvas.height;
  const worldX = mx * (3.0 / view.zoom) + view.centerX;
  const worldY = my * (3.0 / view.zoom) + view.centerY;
  const zf = e.deltaY < 0 ? 1.25 : 0.8;
  view.zoom *= zf; view.zoom = Math.max(0.1, Math.min(view.zoom, 1e14));
  view.centerX = worldX - mx * (3.0 / view.zoom);
  view.centerY = worldY - my * (3.0 / view.zoom);
  render();
}, { passive: false });
canvas.addEventListener('touchstart', e => { e.preventDefault(); if (e.touches.length === 1) touchState = { type: 'pan', x: e.touches[0].clientX, y: e.touches[0].clientY }; else if (e.touches.length === 2) { const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY; touchState = { type: 'pinch', dist: Math.hypot(dx, dy), zoom: view.zoom }; } }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!touchState) return; if (touchState.type === 'pan' && e.touches.length === 1) { const dpr = window.devicePixelRatio || 1; const dx = e.touches[0].clientX - touchState.x, dy = e.touches[0].clientY - touchState.y; const scale = 3.0 / view.zoom / canvas.height * dpr; view.centerX -= dx * scale * 2; view.centerY += dy * scale * 2; touchState.x = e.touches[0].clientX; touchState.y = e.touches[0].clientY; render(); } else if (touchState.type === 'pinch' && e.touches.length === 2) { const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY; const dist = Math.hypot(dx, dy); view.zoom = touchState.zoom * (dist / touchState.dist); view.zoom = Math.max(0.1, Math.min(view.zoom, 1e14)); render(); } }, { passive: false });
canvas.addEventListener('touchend', () => touchState = null);

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  switch (e.key) {
    case 'h': case 'H': document.getElementById('panel').classList.toggle('hidden'); break;
    case 'r': case 'R': setFractalType(state.fractalType); break;
    case 's': case 'S': screenshot(); break;
    case ' ': e.preventDefault(); state.palette = Math.floor(Math.random() * 6); updatePaletteUI(); render(); break;
    case '1': setFractalType(0); break; case '2': setFractalType(1); break; case '3': setFractalType(2); break;
    case '4': setFractalType(3); break; case '5': setFractalType(4); break; case '6': setFractalType(5); break;
    case '7': setFractalType(6); break; case '8': setFractalType(7); break; case '9': setFractalType(8); break;
    case '0': setFractalType(9); break;
  }
});

// ─── UI wiring ───
document.getElementById('fractalType').addEventListener('change', e => setFractalType(parseInt(e.target.value)));
document.getElementById('iterations').addEventListener('input', e => { state.maxIter = parseInt(e.target.value); document.getElementById('iterVal').textContent = state.maxIter; render(); });
document.getElementById('colorSpeed').addEventListener('input', e => { state.colorSpeed = parseFloat(e.target.value); document.getElementById('speedVal').textContent = state.colorSpeed.toFixed(1); render(); });
document.getElementById('colorOffset').addEventListener('input', e => { state.colorOffset = parseFloat(e.target.value); document.getElementById('offsetVal').textContent = state.colorOffset.toFixed(2); render(); });
document.getElementById('smooth').addEventListener('change', e => { state.smooth = e.target.checked; render(); });
document.getElementById('juliaX').addEventListener('input', e => { state.juliaX = parseFloat(e.target.value); document.getElementById('juliaXVal').textContent = state.juliaX.toFixed(4); render(); });
document.getElementById('juliaY').addEventListener('input', e => { state.juliaY = parseFloat(e.target.value); document.getElementById('juliaYVal').textContent = state.juliaY.toFixed(4); render(); });
document.getElementById('power').addEventListener('input', e => { state.power = parseFloat(e.target.value); document.getElementById('powerVal').textContent = state.power.toFixed(1); render(); });
document.getElementById('phoenixP').addEventListener('input', e => { state.phoenixP = parseFloat(e.target.value); document.getElementById('phoenixPVal').textContent = state.phoenixP.toFixed(2); render(); });
document.querySelectorAll('.palette-btn').forEach(btn => btn.addEventListener('click', () => { state.palette = parseInt(btn.dataset.palette); updatePaletteUI(); render(); }));
function updatePaletteUI() { document.querySelectorAll('.palette-btn').forEach(b => b.classList.toggle('active', parseInt(b.dataset.palette) === state.palette)); }
document.getElementById('resetView').addEventListener('click', () => setFractalType(state.fractalType));
function screenshot() { render(); canvas.toBlob(blob => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `fractal_${Date.now()}.png`; a.click(); URL.revokeObjectURL(url); }); }
document.getElementById('screenshot').addEventListener('click', screenshot);

// ─── Init ───
setFractalType(0);
</script>
